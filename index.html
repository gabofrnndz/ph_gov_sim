<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Philippine Government Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Edit Mode Banner -->
  <div id="edit-mode-banner" class="banner banner-warning" style="display: none;">
    <span>⚙️ <strong>EDIT MODE ACTIVE</strong> - Simulation is paused. Scenario configuration unlocked.</span>
  </div>

  <header class="app-header">
    <div class="header-titles">
      <h1>Philippine Government Simulator</h1>
      <p>Administrative, Legislative, and Fiscal Engine</p>
    </div>
    <div class="header-controls">
      <button id="btn-toggle-edit" class="btn btn-secondary">Toggle Edit Mode</button>
      <button id="btn-advance-turn" class="btn btn-success">Advance Turn</button>
      <button id="btn-save-state" class="btn btn-primary">Save State</button>
    </div>
  </header>

  <nav class="main-navigation">
    <button class="nav-tab active" data-target="tab-nation">Nation & Administration</button>
    <button class="nav-tab" data-target="tab-districts">Districts & Local Gov</button>
    <button class="nav-tab" data-target="tab-budget">National Budget</button>
    <button class="nav-tab" data-target="tab-legal">Legal Framework</button>
  </nav>

  <main id="app-container" class="container">
    <section id="tab-nation" class="tab-content active"></section>
    <section id="tab-districts" class="tab-content"></section>
    <section id="tab-budget" class="tab-content"></section>
    <section id="tab-legal" class="tab-content"></section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
